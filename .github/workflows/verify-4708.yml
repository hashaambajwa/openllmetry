name: Verify zero-code instrumentation metadata
on:
  push:
    branches: [verify-4708-metadata]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        integration: [langchain, writer]
    defaults:
      run:
        working-directory: packages/opentelemetry-instrumentation-${{ matrix.integration }}
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e40b4e2568dcc72b0456901ea94c5407d2eca46c
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --all-groups --locked
      - run: uv run --no-sync ruff check tests/test_instruments_extra.py
      - run: uv run --no-sync pytest -q tests/test_instruments_extra.py
